name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    name: Build & Test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Cargo Format Check
        run: cargo fmt --check
      - name: Cargo Check
        run: cargo check
      - name: Cargo Clippy
        run: cargo clippy -- -D warnings
      - name: Cargo Test
        run: cargo test
